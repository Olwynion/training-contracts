syntax = "proto3";
package training;
option csharp_namespace = "Training.Training.Proto";

service TrainingService {
  rpc GetExercises(GetExercisesRequest) returns (GetExercisesResponse);
  rpc CreateExercise(CreateExerciseRequest) returns (CreateExerciseResponse);
  rpc UpdateExercise(UpdateExerciseRequest) returns (UpdateExerciseResponse);
  rpc DeleteExercise(DeleteExerciseRequest) returns (DeleteExerciseResponse);

  rpc CreateWorkoutPlan(CreateWorkoutPlanRequest) returns (CreateWorkoutPlanResponse);
  rpc GetWorkoutPlan(GetWorkoutPlanRequest) returns (GetWorkoutPlanResponse);
  rpc GetUserWorkoutPlans(GetUserWorkoutPlansRequest) returns (GetUserWorkoutPlansResponse);
  rpc UpdateWorkoutPlan(UpdateWorkoutPlanRequest) returns (UpdateWorkoutPlanResponse);
  rpc DeleteWorkoutPlan(DeleteWorkoutPlanRequest) returns (DeleteWorkoutPlanResponse);

  rpc GetCycleData(GetCycleDataRequest) returns (GetCycleDataResponse);
  rpc SetCycle(SetCycleRequest) returns (SetCycleResponse);
  rpc IncrementProgress(IncrementProgressRequest) returns (IncrementProgressResponse);

  rpc SavePreferences(SavePreferencesRequest) returns (SavePreferencesResponse);
  rpc GetUserPreferences(GetUserPreferencesRequest) returns (GetUserPreferencesResponse);
  rpc SaveOneRms(SaveOneRmsRequest) returns (SaveOneRmsResponse);
  rpc UpdatePlanDays(UpdatePlanDaysRequest) returns (UpdatePlanDaysResponse);
  rpc GetBuiltInExercises(GetBuiltInExercisesRequest) returns (GetBuiltInExercisesResponse);
}

enum MuscleGroup {
  MUSCLE_GROUP_UNSPECIFIED = 0;
  CHEST = 1;
  BACK = 2;
  LEGS = 3;
  SHOULDERS = 4;
  BICEPS = 5;
  TRICEPS = 6;
  CORE = 7;
}

message Exercise {
  int64 id = 1;
  string name = 2;
  double default_one_rm = 3;
  MuscleGroup muscle_group = 4;
  string user_id = 5;
  bool is_built_in = 6;
}

message PlanDay {
  int64 id = 1;
  string day_name = 2;
  MuscleGroup focus_group = 3;
  int32 sort_order = 4;
  repeated DayExercise exercises = 5;
}

message DayExercise {
  int64 id = 1;
  int64 exercise_id = 2;
  string exercise_name = 3;
  int32 sets = 4;
  int32 sort_order = 5;
}

message WorkoutPlan {
  int64 id = 1;
  string user_id = 2;
  string name = 3;
  repeated PlanDay days = 4;
  int32 cycle_number = 5;
  int32 progress_counter = 6;
}

message CycleData {
  int64 plan_id = 1;
  int32 cycle_number = 2;
  bool is_light_week = 3;
  int32 progress_counter = 4;
  repeated DayData days = 5;
}

message DayData {
  string day_label = 1;
  MuscleGroup focus_group = 2;
  repeated ExerciseSet sets = 3;
}

message ExerciseSet {
  string exercise_name = 1;
  double one_rm = 2;
  int32 sets = 3;
  double percentage = 4;
  int32 reps = 5;
  double working_weight = 6;
  bool is_focus = 7;
}

message GetExercisesRequest {
  string user_id = 1;
}

message GetExercisesResponse {
  repeated Exercise exercises = 1;
}

message CreateExerciseRequest {
  string name = 1;
  double default_one_rm = 2;
  MuscleGroup muscle_group = 3;
  string user_id = 4;
}

message CreateExerciseResponse {
  Exercise exercise = 1;
}

message UpdateExerciseRequest {
  int64 id = 1;
  string name = 2;
  double default_one_rm = 3;
  MuscleGroup muscle_group = 4;
  string user_id = 5;
}

message UpdateExerciseResponse {
  Exercise exercise = 1;
}

message DeleteExerciseRequest {
  int64 id = 1;
  string user_id = 2;
}

message DeleteExerciseResponse {}

message CreateWorkoutPlanRequest {
  string user_id = 1;
  string name = 2;
}

message CreateWorkoutPlanResponse {
  WorkoutPlan plan = 1;
}

message GetWorkoutPlanRequest {
  int64 id = 1;
  string user_id = 2;
}

message GetWorkoutPlanResponse {
  WorkoutPlan plan = 1;
}

message GetUserWorkoutPlansRequest {
  string user_id = 1;
}

message GetUserWorkoutPlansResponse {
  repeated WorkoutPlan plans = 1;
}

message UpdateWorkoutPlanRequest {
  WorkoutPlan plan = 1;
  string user_id = 2;
}

message UpdateWorkoutPlanResponse {
  WorkoutPlan plan = 1;
}

message DeleteWorkoutPlanRequest {
  int64 id = 1;
  string user_id = 2;
}

message DeleteWorkoutPlanResponse {}

message GetCycleDataRequest {
  int64 plan_id = 1;
  string user_id = 2;
}

message GetCycleDataResponse {
  CycleData data = 1;
}

message SetCycleRequest {
  int64 plan_id = 1;
  int32 cycle_number = 2;
  string user_id = 3;
}

message SetCycleResponse {}

message IncrementProgressRequest {
  int64 plan_id = 1;
  string user_id = 2;
}

message IncrementProgressResponse {}

message UserPreferences {
  string user_id = 1;
  int32 days_per_week = 2;
  string program_type = 3; // "fullbody" | "split"
  MuscleGroup focus_group = 4; // unspecified = равномерно
}

message SavePreferencesRequest {
  string user_id = 1;
  int32 days_per_week = 2;
  string program_type = 3;
  MuscleGroup focus_group = 4;
}

message SavePreferencesResponse {}

message GetUserPreferencesRequest {
  string user_id = 1;
}

message GetUserPreferencesResponse {
  UserPreferences preferences = 1;
}

message SaveOneRmsRequest {
  string user_id = 1;
  repeated OneRmEntry entries = 2;
}

message OneRmEntry {
  int64 exercise_id = 1;
  double one_rm = 2;
}

message SaveOneRmsResponse {}

message GetBuiltInExercisesRequest {}

message GetBuiltInExercisesResponse {
  repeated Exercise exercises = 1;
}

message UpdatePlanDaysRequest {
  int64 plan_id = 1;
  string user_id = 2;
  repeated PlanDayUpdate days = 3;
}

message PlanDayUpdate {
  int64 id = 1;       // 0 = новый день
  string day_name = 2;
  MuscleGroup focus_group = 3;
  int32 sort_order = 4;
  repeated DayExerciseUpdate exercises = 5;
}

message DayExerciseUpdate {
  int64 id = 1;          // 0 = новое
  int64 exercise_id = 2;
  int32 sets = 3;
  int32 sort_order = 4;
}

message UpdatePlanDaysResponse {
  WorkoutPlan plan = 1;
}
